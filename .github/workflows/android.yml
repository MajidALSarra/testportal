name: Build Android APK

# Builds the native Android app on GitHub's runners (which can reach Google's
# SDK servers) and publishes the APK as both a workflow artifact and a
# downloadable release asset.

on:
  push:
    branches: [ "main", "master", "claude/**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk brawl-legends.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: brawl-legends-apk
          path: brawl-legends.apk

      - name: Publish APK to "latest" release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: Auto-built debug APK of Brawl Legends. Sideload on Android (allow "install from unknown sources").
          files: brawl-legends.apk
