name: Build iOS App

# Compiles the app + share extension for the iOS Simulator on a macOS runner — unsigned, so it validates the
# code without an Apple Developer account. Device installs / TestFlight / App Store need signing configured in
# Xcode with the owner's Apple Developer account.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (iOS Simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Folderbird.xcodeproj -scheme Folderbird \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee build.log | grep -E "error:|warning:|BUILD|\*\* " || true
          # the grep above only filters the console; the verdict is read from the full log
          grep -q "BUILD SUCCEEDED" build.log

      - name: Verify both targets were built
        run: |
          grep -E "^=== BUILD TARGET " build.log | sort -u
          grep -q "=== BUILD TARGET Folderbird " build.log
          grep -q "=== BUILD TARGET FolderbirdShare " build.log
          test -d build/Build/Products/Debug-iphonesimulator/Folderbird.app/PlugIns/FolderbirdShare.appex
          echo "Swift warnings: $(grep -cE '\.swift:[0-9]+:[0-9]+: warning:' build.log || true)"

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "=== errors ==="
          grep -nE "error:" build.log | head -200 || true
          echo "=== last 120 lines ==="
          tail -120 build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build.log
          if-no-files-found: ignore

      - name: Package the simulator build
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r -q "$GITHUB_WORKSPACE/Folderbird-simulator.zip" Folderbird.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Folderbird-simulator
          path: Folderbird-simulator.zip
          if-no-files-found: error
