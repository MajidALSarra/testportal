# Slack app for the Folderbird agent team.
# Create it at https://api.slack.com/apps -> Create New App -> From a manifest,
# choose the Folderbird workspace, paste this file, then Install to Workspace.
display_information:
  name: Folderbird Agents
  description: Posts from Majid's Folderbird agent sessions, each under its own name and icon.
  background_color: "#1f2933"
features:
  bot_user:
    display_name: Folderbird Agents
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write            # post messages
      - chat:write.customize  # post under each agent's own name and icon
      - channels:history      # read public channels the app is in
      - groups:history        # read #folderbird-agents, which is private
      - reactions:write       # mark Majid's messages as delivered
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
